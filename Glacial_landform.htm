<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glacial Landforms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>


<style>

/* =====================================================
                    GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    height:100%;

    font-family:'Inter',sans-serif;

    background:#f4f7fa;

}


/* =====================================================
                    CONTAINER
===================================================== */

.container{

    display:flex;

    width:100%;

    height:100vh;

}


/* =====================================================
                      MAP
===================================================== */

#map{

    flex:3.5;

}


/* =====================================================
                  INFORMATION PANEL
===================================================== */

#sidebar{

    width:360px;

    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}

.sidebar-content{

    padding:28px;

}

.sidebar-content h2{

    font-size:28px;

    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}


/* =====================================================
                  INFORMATION TABLE
===================================================== */

.info-table{

    width:100%;

    border-collapse:collapse;

}

.info-table tr{

    border-bottom:1px solid #eceff3;

}

.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}

.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}


/* =====================================================
                    LEGEND
===================================================== */

.legend{

    margin-top:25px;

    padding:15px;

    border:1px solid #e5e7eb;

    border-radius:8px;

    background:#f8fafc;

}

.legend-title{

    font-size:14px;

    font-weight:600;

    color:#16324f;

    margin-bottom:12px;

}

.legend-item{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    font-size:13px;

    color:#475569;

}

.legend-item:last-child{

    margin-bottom:0;

}

.legend-box{

    width:18px;

    height:18px;

    margin-right:10px;

    border-radius:3px;

}


/* Glacier legend */

.glacier-legend{

    background:#5BBBE8;

    border:2px solid #00D4FF;

}


/* Lake legend */

.lake-legend{

    background:#4FC3F7;

    border:2px solid #0066FF;

}


/* =====================================================
                 DOWNLOAD SECTION
===================================================== */

.download-section{

    margin-top:30px;

}

.download-title{

    font-size:14px;

    color:#64748b;

    font-weight:600;

    margin-bottom:12px;

}


/* =====================================================
                  DOWNLOAD BUTTON
===================================================== */

.download-btn{

    width:100%;

    padding:14px;

    margin-bottom:10px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:white;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.download-btn:hover{

    background:#1d70b8;

}

.download-btn:last-child{

    margin-bottom:0;

}


/* =====================================================
                    RESPONSIVE
===================================================== */

@media(max-width:992px){

    .container{

        flex-direction:column;

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;

        height:40vh;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
                         MAP
    ================================================= -->

    <div id="map"></div>


    <!-- =================================================
                    INFORMATION PANEL
    ================================================= -->

    <aside id="sidebar">

        <div class="sidebar-content">


            <h2>Feature Information</h2>


            <table class="info-table">


                <!-- NAME -->

                <tr>

                    <th>Name</th>

                    <td id="feature-name">-</td>

                </tr>


                <!-- TYPE -->

                <tr>

                    <th>Type</th>

                    <td id="feature-type">-</td>

                </tr>


                <!-- STATE -->

                <tr>

                    <th>State</th>

                    <td id="feature-state">-</td>

                </tr>


                <!-- MAIN BASIN -->

                <tr>

                    <th>Main Basin</th>

                    <td id="main-basin">-</td>

                </tr>


                <!-- SUB BASIN -->

                <tr>

                    <th>Sub Basin</th>

                    <td id="sub-basin">-</td>

                </tr>


                <!-- AREA -->

                <tr>

                    <th>Area (Sq.km)</th>

                    <td id="feature-area">-</td>

                </tr>


            </table>


            <!-- =================================================
                            LEGEND
            ================================================= -->

            <div class="legend">


                <div class="legend-title">

                    Map Layers

                </div>


                <div class="legend-item">

                    <div class="legend-box glacier-legend"></div>

                    <span>Glaciers</span>

                </div>


                <div class="legend-item">

                    <div class="legend-box lake-legend"></div>

                    <span>Glacial Lakes</span>

                </div>


            </div>


            <!-- =================================================
                        DOWNLOAD SECTION
            ================================================= -->

            <div class="download-section">


                <div class="download-title">

                    Download Datasets

                </div>


                <!-- GLACIER DOWNLOAD -->

                <button
                    class="download-btn"
                    id="download-glacier">

                    ⬇ Download Glacier Dataset

                </button>


                <!-- LAKE DOWNLOAD -->

                <button
                    class="download-btn"
                    id="download-lake">

                    ⬇ Download Glacial Lake Dataset

                </button>


            </div>


        </div>

    </aside>


</div>


<!-- =====================================================
                    LEAFLET JS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl:true,

    /* Prevent excessive zooming out */

    minZoom:6,

    /* Detailed viewing */

    maxZoom:18,

    /* Prevent dragging outside boundary */

    maxBoundsViscosity:1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

const himalayanBounds = L.latLngBounds(

    [27.5,73.5],

    [37.5,97.5]

);


/* =====================================================
                MAP PAN BOUNDARY
===================================================== */

const mapBounds = L.latLngBounds(

    [26.5,72.0],

    [38.5,99.0]

);


/* Apply map movement restriction */

map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL VIEW
===================================================== */

map.fitBounds(

    himalayanBounds,

    {

        padding:[20,20]

    }

);


/* =====================================================
                  ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:'Tiles © Esri',

        maxZoom:19

    }

).addTo(map);


/* =====================================================
                    SCALE BAR
===================================================== */

L.control.scale({

    metric:true,

    imperial:false

}).addTo(map);


/* =====================================================
                  GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  GLACIER HIGHLIGHT
===================================================== */

function glacierHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.70

    });

}


/* =====================================================
                    LAKE STYLE
===================================================== */

function lakeStyle(feature){

    return{

        color:"#0066FF",

        weight:1.5,

        fillColor:"#4FC3F7",

        fillOpacity:0.55

    };

}


/* =====================================================
                    LAKE HIGHLIGHT
===================================================== */

function lakeHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.80

    });

}


/* =====================================================
            RESET ALL FEATURE STYLES
===================================================== */

function resetAllLayers(){

    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            glacierLayer.resetStyle(layer);

        });

    }


    if(lakeLayer){

        lakeLayer.eachLayer(function(layer){

            lakeLayer.resetStyle(layer);

        });

    }

}


/* =====================================================
              DISPLAY FEATURE INFORMATION
===================================================== */

function displayFeatureInfo(

    name,

    type,

    state,

    mainBasin,

    subBasin,

    area

){


    document.getElementById(

        "feature-name"

    ).innerHTML = name || "-";


    document.getElementById(

        "feature-type"

    ).innerHTML = type || "-";


    document.getElementById(

        "feature-state"

    ).innerHTML = state || "-";


    document.getElementById(

        "main-basin"

    ).innerHTML = mainBasin || "-";


    document.getElementById(

        "sub-basin"

    ).innerHTML = subBasin || "-";


    if(

        area !== undefined &&

        area !== null &&

        area !== ""

    ){

        const numericArea = Number(area);


        if(!isNaN(numericArea)){

            document.getElementById(

                "feature-area"

            ).innerHTML =

                numericArea.toFixed(3)

                + " km²";

        }

        else{

            document.getElementById(

                "feature-area"

            ).innerHTML = area + " km²";

        }

    }

    else{

        document.getElementById(

            "feature-area"

        ).innerHTML = "-";

    }

}


/* =====================================================
                  LAYER VARIABLES
===================================================== */

let glacierLayer;

let lakeLayer;


/* =====================================================
                    LOAD GLACIERS
===================================================== */

fetch("Indian_Glaciers.geojson")


.then(response => {


    if(!response.ok){

        throw new Error(

            "Indian_Glaciers.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data => {


    glacierLayer = L.geoJSON(

        data,

        {

            style:glacierStyle,


            onEachFeature:function(

                feature,

                layer

            ){


                layer.on({

                    click:function(e){


                        /* Reset both layers */

                        resetAllLayers();


                        /* Highlight glacier */

                        glacierHighlight(

                            e.target

                        );


                        /* Read glacier attributes */

                        const properties =

                            feature.properties;


                        displayFeatureInfo(

                            properties["Name"],

                            properties["Type"],

                            properties["State"],

                            properties["Main Basin"],

                            properties["Sub basin"],

                            properties["Area(Sq.km)"]

                        );

                    }

                });

            }

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glaciers.geojson"

    );

});


/* =====================================================
                  LOAD GLACIAL LAKES
===================================================== */

fetch("Indian_Glacial_Lakes.geojson")


.then(response =>{


    if(!response.ok){

        throw new Error(

            "Indian_Glacial_Lakes.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data =>{


    lakeLayer = L.geoJSON(

        data,

        {

            style:lakeStyle,


            onEachFeature:function(

                feature,

                layer

            ){


                layer.on({

                    click:function(e){


                        /* Reset both layers */

                        resetAllLayers();


                        /* Highlight lake */

                        lakeHighlight(

                            e.target

                        );


                        /* Read lake attributes */

                        const properties =

                            feature.properties;


                        displayFeatureInfo(

                            properties["Name"],

                            properties["Type"],

                            properties["State"],

                            "-",

                            "-",

                            properties["Area (Sq.km)"]

                        );

                    }

                });

            }

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glacial_Lakes.geojson"

    );

});


/* =====================================================
                DOWNLOAD GLACIER DATASET
===================================================== */

document.getElementById(

    "download-glacier"

).onclick = function(){

    window.location.href =

        "Indian_Glaciers.zip";

};


/* =====================================================
              DOWNLOAD GLACIAL LAKE DATASET
===================================================== */

document.getElementById(

    "download-lake"

).onclick = function(){

    window.location.href =

        "Indian_Glacial_Lakes.zip";

};


</script>


</body>

</html>
