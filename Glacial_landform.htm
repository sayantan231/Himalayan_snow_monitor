<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indian Glaciology</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

/* =====================================================
                    GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    height:100%;

    font-family:'Inter',sans-serif;

    background:#f4f7fa;

}


/* =====================================================
                    HEADER
===================================================== */

#header{

    height:60px;

    width:100%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    border-bottom:3px solid #1677b7;

    z-index:1000;

}


/* =====================================================
                    HEADER LOGO
===================================================== */

.header-logo{

    position:absolute;

    left:20px;

    height:44px;

    width:auto;

    object-fit:contain;

}


/* =====================================================
                    HEADER TITLE
===================================================== */

.header-title{

    font-size:34px;

    font-weight:700;

    letter-spacing:0.5px;

    background:linear-gradient(

        90deg,

        #0f4c81,

        #1677b7,

        #5BBBE8

    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    background-clip:text;

}


/* =====================================================
                    MAIN CONTAINER
===================================================== */

.container{

    display:flex;

    width:100%;

    height:calc(100vh - 60px);

}


/* =====================================================
                      MAP
===================================================== */

#map{

    flex:3.5;

}


/* =====================================================
                  INFORMATION PANEL
===================================================== */

#sidebar{

    width:360px;

    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}

.sidebar-content{

    padding:28px;

}

.sidebar-content h2{

    font-size:28px;

    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}


/* =====================================================
                 DROPDOWN SECTION
===================================================== */

.selector-section{

    margin-bottom:10px;

    padding-bottom:18px;

    border-bottom:1px solid #eceff3;

}


/* =====================================================
                 DROPDOWN LABEL
===================================================== */

.selector-label{

    display:block;

    font-size:15px;

    color:#64748b;

    font-weight:600;

    margin-bottom:9px;

}


/* =====================================================
                  DROPDOWN
===================================================== */

.state-select,
.glacier-select{

    width:100%;

    padding:12px 14px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:#ffffff;

    color:#1f2937;

    font-family:'Inter',sans-serif;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    transition:.2s;

}

.state-select:hover,
.glacier-select:hover{

    border-color:#5BBBE8;

}

.state-select:focus,
.glacier-select:focus{

    border-color:#0f4c81;

    box-shadow:0 0 0 3px rgba(15,76,129,0.10);

}


/* Disabled */

.glacier-select:disabled{

    background:#f1f5f9;

    color:#94a3b8;

    cursor:not-allowed;

}


/* =====================================================
                  INFORMATION TABLE
===================================================== */

.info-table{

    width:100%;

    border-collapse:collapse;

}

.info-table tr{

    border-bottom:1px solid #eceff3;

}

.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}

.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}


/* =====================================================
                    DOWNLOAD BUTTON
===================================================== */

.download-section{

    margin-top:25px;

}

#download-btn{

    width:100%;

    padding:13px 18px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:white;

    font-family:'Inter',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;

}

#download-btn:hover{

    background:#1677b7;

    transform:translateY(-1px);

}

#download-btn:disabled{

    background:#cbd5e1;

    color:#64748b;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
                    LEGEND
===================================================== */

.legend{

    margin-top:25px;

    padding:15px;

    border:1px solid #e5e7eb;

    border-radius:8px;

    background:#f8fafc;

}

.legend-title{

    font-size:14px;

    font-weight:600;

    color:#16324f;

    margin-bottom:12px;

}

.legend-item{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    font-size:13px;

    color:#475569;

}

.legend-item:last-child{

    margin-bottom:0;

}

.legend-box{

    width:18px;

    height:18px;

    margin-right:10px;

    border-radius:3px;

}


/* Glacier legend */

.glacier-legend{

    background:#5BBBE8;

    border:2px solid #00D4FF;

}


/* =====================================================
                  LOGIN OVERLAY
===================================================== */

#login-overlay{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(3,15,27,0.65);

    backdrop-filter:blur(5px);

    z-index:5000;

    align-items:center;

    justify-content:center;

}


/* =====================================================
                    LOGIN BOX
===================================================== */

.login-box{

    width:390px;

    max-width:90%;

    background:#ffffff;

    border-radius:14px;

    padding:32px;

    box-shadow:0 20px 60px rgba(0,0,0,0.25);

    position:relative;

    animation:loginAppear .25s ease;

}


@keyframes loginAppear{

    from{

        opacity:0;

        transform:translateY(15px) scale(.98);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}


/* =====================================================
                    LOGIN TITLE
===================================================== */

.login-title{

    text-align:center;

    font-size:25px;

    font-weight:700;

    color:#16324f;

    margin-bottom:8px;

}


.login-subtitle{

    text-align:center;

    font-size:13px;

    color:#64748b;

    margin-bottom:25px;

}


/* =====================================================
                  CLOSE BUTTON
===================================================== */

.login-close{

    position:absolute;

    top:14px;

    right:18px;

    border:none;

    background:none;

    font-size:25px;

    color:#64748b;

    cursor:pointer;

}

.login-close:hover{

    color:#0f4c81;

}


/* =====================================================
                    LOGIN LABEL
===================================================== */

.login-label{

    display:block;

    font-size:14px;

    font-weight:600;

    color:#475569;

    margin-bottom:7px;

}


/* =====================================================
                  LOGIN INPUT
===================================================== */

.login-input{

    width:100%;

    padding:12px 13px;

    margin-bottom:17px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-family:'Inter',sans-serif;

    font-size:14px;

    outline:none;

}

.login-input:focus{

    border-color:#1677b7;

    box-shadow:0 0 0 3px rgba(22,119,183,0.10);

}


/* =====================================================
                    LOGIN BUTTON
===================================================== */

#login-btn{

    width:100%;

    padding:13px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:white;

    font-family:'Inter',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

}

#login-btn:hover{

    background:#1677b7;

}


/* =====================================================
                    LOGIN MESSAGE
===================================================== */

#login-message{

    margin-top:14px;

    text-align:center;

    font-size:13px;

    color:#dc2626;

    display:none;

}


/* =====================================================
                    RESPONSIVE
===================================================== */

@media(max-width:992px){

    #header{

        height:55px;

    }

    .header-logo{

        left:12px;

        height:40px;

    }

    .header-title{

        font-size:22px;

    }

    .container{

        flex-direction:column;

        height:calc(100vh - 55px);

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;

        height:40vh;

    }

}

</style>

</head>


<body>


<!-- =====================================================
                        HEADER
===================================================== -->

<header id="header">

    <img
        src="Indian_Glaciology_Logo.jpg"
        alt="Indian Glaciology Logo"
        class="header-logo"
    >

    <div class="header-title">

        Indian Glaciology

    </div>

</header>


<!-- =====================================================
                    MAIN CONTAINER
===================================================== -->

<div class="container">


    <!-- MAP -->

    <div id="map"></div>


    <!-- INFORMATION PANEL -->

    <aside id="sidebar">

        <div class="sidebar-content">


            <h2>Feature Information</h2>


            <!-- SELECT STATE -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="state-select">

                    Select State/UT

                </label>

                <select
                    id="state-select"
                    class="state-select">

                    <option value="ALL">

                        All States/UTs

                    </option>

                </select>

            </div>


            <!-- SELECT GLACIER -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="glacier-select">

                    Select Glacier

                </label>

                <select
                    id="glacier-select"
                    class="glacier-select"
                    disabled>

                    <option value="">

                        Select a State/UT first

                    </option>

                </select>

            </div>


            <!-- INFORMATION TABLE -->

            <table class="info-table">


                <tr>

                    <th>Name</th>

                    <td id="feature-name">-</td>

                </tr>


                <tr>

                    <th>Type</th>

                    <td id="feature-type">-</td>

                </tr>


                <tr>

                    <th>State</th>

                    <td id="feature-state">-</td>

                </tr>


                <tr>

                    <th>Main Basin</th>

                    <td id="main-basin">-</td>

                </tr>


                <tr>

                    <th>Sub Basin</th>

                    <td id="sub-basin">-</td>

                </tr>


                <tr>

                    <th>Area (Sq.km)</th>

                    <td id="feature-area">-</td>

                </tr>


            </table>


            <!-- =================================================
                    DOWNLOAD SELECTED GLACIER
            ================================================= -->

            <div class="download-section">

                <button
                    id="download-btn"
                    disabled>

                    🔐 Download Selected Glacier

                </button>

            </div>


            <!-- LEGEND -->

            <div class="legend">

                <div class="legend-title">

                    Map Layers

                </div>

                <div class="legend-item">

                    <div class="legend-box glacier-legend"></div>

                    <span>Glaciers</span>

                </div>

            </div>


        </div>

    </aside>

</div>


<!-- =====================================================
                    LOGIN OVERLAY
===================================================== -->

<div id="login-overlay">


    <div class="login-box">


        <!-- CLOSE -->

        <button
            class="login-close"
            id="login-close">

            ×

        </button>


        <!-- TITLE -->

        <div class="login-title">

            Welcome Back

        </div>


        <div class="login-subtitle">

            Login to download glacier datasets

        </div>


        <!-- EMAIL -->

        <label
            class="login-label"
            for="login-email">

            Email Address

        </label>


        <input
            type="email"
            id="login-email"
            class="login-input"
            placeholder="Enter your email"
        >


        <!-- PASSWORD -->

        <label
            class="login-label"
            for="login-password">

            Password

        </label>


        <input
            type="password"
            id="login-password"
            class="login-input"
            placeholder="Enter your password"
        >


        <!-- LOGIN -->

        <button
            id="login-btn">

            Login & Download

        </button>


        <div id="login-message">

            Please enter your email and password.

        </div>


    </div>

</div>


<!-- =====================================================
                    LEAFLET JS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl:true,

    minZoom:6,

    maxZoom:18,

    maxBoundsViscosity:1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

const himalayanBounds = L.latLngBounds(

    [27.5,73.5],

    [37.5,97.5]

);


/* =====================================================
                MAP PAN BOUNDARY
===================================================== */

const mapBounds = L.latLngBounds(

    [26.5,72.0],

    [38.5,99.0]

);

map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL VIEW
===================================================== */

map.fitBounds(

    himalayanBounds,

    {

        padding:[20,20]

    }

);


/* =====================================================
                  ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:'Tiles © Esri',

        maxZoom:19

    }

).addTo(map);


/* =====================================================
                    SCALE BAR
===================================================== */

L.control.scale({

    metric:true,

    imperial:false

}).addTo(map);


/* =====================================================
                  GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  GLACIER HIGHLIGHT
===================================================== */

function glacierHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.70

    });

}


/* =====================================================
            RESET GLACIER FEATURE STYLES
===================================================== */

function resetAllLayers(){

    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            glacierLayer.resetStyle(layer);

        });

    }

}


/* =====================================================
              DISPLAY FEATURE INFORMATION
===================================================== */

function displayFeatureInfo(

    name,
    type,
    state,
    mainBasin,
    subBasin,
    area

){

    document.getElementById(
        "feature-name"
    ).innerHTML = name || "-";


    document.getElementById(
        "feature-type"
    ).innerHTML = type || "-";


    document.getElementById(
        "feature-state"
    ).innerHTML = state || "-";


    document.getElementById(
        "main-basin"
    ).innerHTML = mainBasin || "-";


    document.getElementById(
        "sub-basin"
    ).innerHTML = subBasin || "-";


    if(

        area !== undefined &&
        area !== null &&
        area !== ""

    ){

        const numericArea = Number(area);


        if(!isNaN(numericArea)){

            document.getElementById(
                "feature-area"
            ).innerHTML =

                numericArea.toFixed(3)

                + " km²";

        }

        else{

            document.getElementById(
                "feature-area"
            ).innerHTML =

                area + " km²";

        }

    }

    else{

        document.getElementById(
            "feature-area"
        ).innerHTML = "-";

    }

}


/* =====================================================
              RESET FEATURE INFORMATION
===================================================== */

function resetFeatureInfo(){

    document.getElementById(
        "feature-name"
    ).innerHTML = "-";


    document.getElementById(
        "feature-type"
    ).innerHTML = "-";


    document.getElementById(
        "feature-state"
    ).innerHTML = "-";


    document.getElementById(
        "main-basin"
    ).innerHTML = "-";


    document.getElementById(
        "sub-basin"
    ).innerHTML = "-";


    document.getElementById(
        "feature-area"
    ).innerHTML = "-";


    document.getElementById(
        "download-btn"
    ).disabled = true;

}


/* =====================================================
                  LAYER VARIABLES
===================================================== */

let glacierLayer;


/* =====================================================
              ORIGINAL GLACIER DATA
===================================================== */

let glacierData;


/* =====================================================
              CURRENT SELECTED GLACIER
===================================================== */

let selectedGlacierFeature = null;


/* =====================================================
            GET STATE FIELD
===================================================== */

function getState(properties){

    if(!properties){

        return "";

    }

    return (

        properties["state"] ??

        properties["State"] ??

        ""

    ).toString().trim();

}


/* =====================================================
            GET GLACIER NAME
===================================================== */

function getGlacierName(properties){

    if(!properties){

        return "";

    }

    return (

        properties["Name"] ??

        properties["name"] ??

        ""

    ).toString().trim();

}


/* =====================================================
              POPULATE STATE DROPDOWN
===================================================== */

function populateStateDropdown(data){

    const stateSelect =

        document.getElementById(
            "state-select"
        );


    const states = new Set();


    data.features.forEach(function(feature){

        const state = getState(
            feature.properties
        );


        if(state){

            states.add(state);

        }

    });


    const sortedStates =

        Array.from(states).sort(

            function(a,b){

                return a.localeCompare(b);

            }

        );


    sortedStates.forEach(function(state){

        const option =

            document.createElement("option");


        option.value = state;

        option.textContent = state;


        stateSelect.appendChild(option);

    });

}


/* =====================================================
              POPULATE GLACIER DROPDOWN
===================================================== */

function populateGlacierDropdown(selectedState){

    const glacierSelect =

        document.getElementById(
            "glacier-select"
        );


    glacierSelect.innerHTML = "";


    const defaultOption =

        document.createElement("option");


    defaultOption.value = "";

    defaultOption.textContent =

        "Select Glacier";


    glacierSelect.appendChild(
        defaultOption
    );


    if(!glacierData){

        glacierSelect.disabled = true;

        return;

    }


    let filteredFeatures;


    if(selectedState === "ALL"){

        filteredFeatures =
            glacierData.features;

    }

    else{

        filteredFeatures =

            glacierData.features.filter(

                function(feature){

                    return (

                        getState(
                            feature.properties
                        ) === selectedState

                    );

                }

            );

    }


    filteredFeatures.sort(

        function(a,b){

            return getGlacierName(
                a.properties
            ).localeCompare(

                getGlacierName(
                    b.properties
                )

            );

        }

    );


    filteredFeatures.forEach(

        function(feature){

            const name =

                getGlacierName(
                    feature.properties
                );


            if(name){

                const option =

                    document.createElement(
                        "option"
                    );


                option.value =

                    glacierData.features.indexOf(
                        feature
                    );


                option.textContent = name;


                glacierSelect.appendChild(
                    option
                );

            }

        }

    );


    glacierSelect.disabled = false;

}


/* =====================================================
              FILTER GLACIERS BY STATE
===================================================== */

function filterGlaciersByState(selectedState){

    if(!glacierData){

        return;

    }


    if(glacierLayer){

        map.removeLayer(glacierLayer);

    }


    resetFeatureInfo();

    selectedGlacierFeature = null;


    populateGlacierDropdown(
        selectedState
    );


    if(selectedState === "ALL"){

        glacierLayer = L.geoJSON(

            glacierData,

            {

                style:glacierStyle,

                onEachFeature:
                    glacierFeatureEvents

            }

        ).addTo(map);


        map.fitBounds(

            himalayanBounds,

            {

                padding:[20,20]

            }

        );


        return;

    }


    const filteredFeatures =

        glacierData.features.filter(

            function(feature){

                return (

                    getState(
                        feature.properties
                    ) === selectedState

                );

            }

        );


    const filteredData = {

        type:"FeatureCollection",

        features:filteredFeatures

    };


    glacierLayer = L.geoJSON(

        filteredData,

        {

            style:glacierStyle,

            onEachFeature:
                glacierFeatureEvents

        }

    ).addTo(map);


    if(

        filteredFeatures.length > 0 &&

        glacierLayer.getBounds().isValid()

    ){

        map.fitBounds(

            glacierLayer.getBounds(),

            {

                padding:[40,40],

                maxZoom:10

            }

        );

    }

}


/* =====================================================
            GLACIER FEATURE EVENTS
===================================================== */

function glacierFeatureEvents(

    feature,
    layer

){

    layer.on({

        click:function(e){

            resetAllLayers();


            glacierHighlight(
                e.target
            );


            selectedGlacierFeature = feature;


            const properties =
                feature.properties;


            displayFeatureInfo(

                getGlacierName(properties),

                properties["Type"],

                getState(properties),

                properties["Main Basin"],

                properties["Sub basin"],

                properties["Area(Sq.km)"]

            );


            const glacierSelect =

                document.getElementById(
                    "glacier-select"
                );


            const index =

                glacierData.features.indexOf(
                    feature
                );


            if(index !== -1){

                glacierSelect.value = index;

            }


            /* ENABLE DOWNLOAD */

            document.getElementById(
                "download-btn"
            ).disabled = false;

        }

    });

}


/* =====================================================
              SELECT GLACIER FROM DROPDOWN
===================================================== */

function selectGlacierFromDropdown(

    featureIndex

){

    if(

        featureIndex === "" ||

        !glacierData

    ){

        selectedGlacierFeature = null;

        resetFeatureInfo();

        return;

    }


    const feature =

        glacierData.features[
            Number(featureIndex)
        ];


    if(!feature){

        return;

    }


    selectedGlacierFeature = feature;


    let selectedLayer = null;


    if(glacierLayer){

        glacierLayer.eachLayer(

            function(layer){

                if(
                    layer.feature === feature
                ){

                    selectedLayer = layer;

                }

            }

        );

    }


    resetAllLayers();


    if(selectedLayer){

        glacierHighlight(
            selectedLayer
        );

    }


    const properties =
        feature.properties;


    displayFeatureInfo(

        getGlacierName(properties),

        properties["Type"],

        getState(properties),

        properties["Main Basin"],

        properties["Sub basin"],

        properties["Area(Sq.km)"]

    );


    /* ENABLE DOWNLOAD */

    document.getElementById(
        "download-btn"
    ).disabled = false;


    if(

        feature.geometry &&

        selectedLayer

    ){

        const bounds =
            selectedLayer.getBounds();


        if(bounds.isValid()){

            map.fitBounds(

                bounds,

                {

                    padding:[70,70],

                    maxZoom:14

                }

            );

        }

    }

}


/* =====================================================
              DOWNLOAD BUTTON
===================================================== */

document.getElementById(
    "download-btn"
).addEventListener(

    "click",

    function(){

        if(!selectedGlacierFeature){

            alert(
                "Please select a glacier first."
            );

            return;

        }


        /*
        IMPORTANT:

        At this stage we only OPEN
        the login interface.

        Authentication will later
        be connected to Python +
        SQLite.
        */


        document.getElementById(
            "login-overlay"
        ).style.display = "flex";


        document.getElementById(

===================================================== */

/* =====================================================
                LOGIN BUTTON
===================================================== */

document.getElementById(

).addEventListener(

    "click",

    function(){

            document.getElementById(
                "login-email"
            ).value.trim();


        const password =

                "login-password"
            ).value;


        const message =

            document.getElementById(

            message.style.display = "block";

            return;

        }


        /*
        TEMPORARY LOGIN

        This is NOT real authentication.

        It only demonstrates the
        user interface.

        */

        message.style.display = "none";


        downloadSelectedGlacier();


        document.getElementById(
            "login-overlay"
        ).style.display = "none";

    }

);


/* =====================================================
              DOWNLOAD SELECTED GLACIER
===================================================== */

function downloadSelectedGlacier(){

    if(!selectedGlacierFeature){

        alert(
            "No glacier selected."
        );

        return;

    }


    /* Create FeatureCollection */

    const selectedData = {

        type:"FeatureCollection",

        features:[
            selectedGlacierFeature
        ]

    };


    /* Convert to JSON */

    const jsonData =

        JSON.stringify(
            selectedData,
            null,
            2
        );


    /* Create file */

    const blob = new Blob(

        [jsonData],

        {

            type:"application/geo+json"

        }

    );


    /* Create temporary URL */

    const url =

        URL.createObjectURL(blob);


    /* Create download link */

    const link =

        document.createElement("a");


    link.href = url;


    const glacierName =

        getGlacierName(
            selectedGlacierFeature.properties
        );


    link.download =

        glacierName.replace(
            /[^a-z0-9]/gi,
            "_"
        )

        + ".geojson";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);

}


/* =====================================================
                    LOAD GLACIERS
===================================================== */

fetch("Indian_Glaciers.geojson")


.then(response => {

    if(!response.ok){

        throw new Error(

            "Indian_Glaciers.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data => {

    glacierData = data;


    populateStateDropdown(data);


    populateGlacierDropdown("ALL");


    glacierLayer = L.geoJSON(

        data,

        {

            style:glacierStyle,

            onEachFeature:
                glacierFeatureEvents

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glaciers.geojson"

    );

});
