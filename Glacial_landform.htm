<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glacial Landforms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    height:100%;
    font-family:'Inter',sans-serif;
    background:#f4f7fa;

}

.container{

    display:flex;
    width:100%;
    height:100vh;

}

/* ===========================
        MAP
=========================== */

#map{

    flex:3.5;

}

/* ===========================
      INFORMATION PANEL
=========================== */

#sidebar{

    width:360px;
    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}

.sidebar-content{

    padding:28px;

}

.sidebar-content h2{

    font-size:28px;
    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}

.info-table{

    width:100%;
    border-collapse:collapse;

}

.info-table tr{

    border-bottom:1px solid #eceff3;

}

.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}

.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}

/* ===========================
       DOWNLOAD BUTTON
=========================== */

#download-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

#download-btn:hover{

    background:#1d70b8;

}

/* ===========================
       RESPONSIVE
=========================== */

@media(max-width:992px){

    .container{

        flex-direction:column;

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;
        height:40vh;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- ===========================
            MAP
    =========================== -->

    <div id="map"></div>


    <!-- ===========================
        INFORMATION PANEL
    =========================== -->

    <aside id="sidebar">

        <div class="sidebar-content">

            <h2>Feature Information</h2>


            <table class="info-table">

                <tr>
                    <th>Name</th>
                    <td id="glacier-name">-</td>
                </tr>

                <tr>
                    <th>Type</th>
                    <td id="glacier-type">-</td>
                </tr>

                <tr>
                    <th>State</th>
                    <td id="glacier-state">-</td>
                </tr>

                <tr>
                    <th>Main Basin</th>
                    <td id="main-basin">-</td>
                </tr>

                <tr>
                    <th>Sub Basin</th>
                    <td id="sub-basin">-</td>
                </tr>

                <tr>
                    <th>Area (Sq.km)</th>
                    <td id="glacier-area">-</td>
                </tr>

            </table>


            <!-- DOWNLOAD BUTTON -->

            <div style="margin-top:30px;">

                <button id="download-btn">

                    ⬇ Download Dataset

                </button>

            </div>


        </div>

    </aside>


</div>


<!-- ===========================
        LEAFLET JS
=========================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl: true,

    /* Prevent excessive zooming out */
    minZoom: 6,

    /* Allow detailed glacier viewing */
    maxZoom: 18,

    /* Prevent map from being dragged outside bounds */
    maxBoundsViscosity: 1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

/*
    Initial map extent:

    Southwest:
    27.5° N
    73.5° E

    Northeast:
    37.5° N
    97.5° E

    This provides the Ladakh → Arunachal Pradesh
    Himalayan overview.
*/

const himalayanBounds = L.latLngBounds(

    [27.5, 73.5],

    [37.5, 97.5]

);


/* =====================================================
                  MAP PAN BOUNDARY
===================================================== */

/*
    This prevents the user from dragging the map
    indefinitely to the left or right.

    The boundary is slightly larger than the initial
    extent so navigation does not feel too restrictive.
*/

const mapBounds = L.latLngBounds(

    [26.5, 72.0],

    [38.5, 99.0]

);


/* Apply the movement boundary */

map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL MAP VIEW
===================================================== */

map.fitBounds(himalayanBounds, {

    padding: [20, 20]

});


/* =====================================================
                    ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution: 'Tiles © Esri',

        maxZoom: 19

    }

).addTo(map);


/* =====================================================
                      SCALE BAR
===================================================== */

L.control.scale({

    metric: true,

    imperial: false

}).addTo(map);


/* =====================================================
                    GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  HIGHLIGHT STYLE
===================================================== */

function highlightStyle(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.7

    });

}


/* =====================================================
                    LOAD GEOJSON
===================================================== */

let glacierLayer;


fetch("Indian_Glaciers.geojson")


.then(response => {

    if(!response.ok){

        throw new Error(

            "GeoJSON could not be loaded."

        );

    }

    return response.json();

})


.then(data => {


    /* ================================================
                CREATE GLACIER LAYER
    ================================================ */

    glacierLayer = L.geoJSON(data,{

        style: glacierStyle,


        onEachFeature: function(feature, layer){


            layer.on({

                /* ====================================
                        GLACIER CLICK
                ==================================== */

                click:function(e){


                    /* Reset previous glacier */

                    glacierLayer.resetStyle();


                    /* Highlight selected glacier */

                    highlightStyle(e.target);


                    /* =================================
                       FEATURE INFORMATION
                    ================================= */


                    document.getElementById(

                        "glacier-name"

                    ).innerHTML =

                        feature.properties["Name"] || "-";


                    document.getElementById(

                        "glacier-type"

                    ).innerHTML =

                        feature.properties["Type"] || "-";


                    document.getElementById(

                        "glacier-state"

                    ).innerHTML =

                        feature.properties["State"] || "-";


                    document.getElementById(

                        "main-basin"

                    ).innerHTML =

                        feature.properties["Main Basin"] || "-";


                    document.getElementById(

                        "sub-basin"

                    ).innerHTML =

                        feature.properties["Sub basin"] || "-";


                    /* =================================
                            AREA
                    ================================= */

                    const area =

                        feature.properties["Area(Sq.km)"];


                    if(

                        area !== undefined &&

                        area !== null &&

                        area !== ""

                    ){

                        document.getElementById(

                            "glacier-area"

                        ).innerHTML =

                            Number(area).toFixed(3)

                            + " km²";

                    }

                    else{

                        document.getElementById(

                            "glacier-area"

                        ).innerHTML = "-";

                    }

                }

            });

        }

    }).addTo(map);


    /*
        IMPORTANT:

        The map is NOT fitted to the GeoJSON.

        The initial view remains the fixed
        Indian Himalayan extent.
    */

})


/* =====================================================
                    ERROR HANDLING
===================================================== */

.catch(error => {

    console.error(error);

    alert(

        "Unable to load Indian_Glaciers.geojson"

    );

});


/* =====================================================
                  DOWNLOAD DATASET
===================================================== */

document.getElementById(

    "download-btn"

).onclick = function(){

    window.location.href =

        "Indian_Glaciers.zip";

};


</script>


</body>

</html>
