<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indian Glaciology</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

/* =====================================================
                    GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    height:100%;

    font-family:'Inter',sans-serif;

    background:#f4f7fa;

}


/* =====================================================
                    HEADER
===================================================== */

#header{

    height:60px;

    width:100%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    border-bottom:3px solid #1677b7;

    z-index:1000;

}


.header-logo{

    position:absolute;

    left:20px;

    height:44px;

    width:auto;

    object-fit:contain;

}


.header-title{

    font-size:34px;

    font-weight:700;

    letter-spacing:0.5px;

    background:linear-gradient(
        90deg,
        #0f4c81,
        #1677b7,
        #5BBBE8
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    background-clip:text;

}


/* =====================================================
                    MAIN CONTAINER
===================================================== */

.container{

    display:flex;

    width:100%;

    height:calc(100vh - 60px);

}


/* =====================================================
                      MAP
===================================================== */

#map{

    flex:3.5;

}


/* =====================================================
                  INFORMATION PANEL
===================================================== */

#sidebar{

    width:360px;

    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}


.sidebar-content{

    padding:28px;

}


.sidebar-content h2{

    font-size:28px;

    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}


/* =====================================================
                 DROPDOWN SECTION
===================================================== */

.selector-section{

    margin-bottom:10px;

    padding-bottom:18px;

    border-bottom:1px solid #eceff3;

}


.selector-label{

    display:block;

    font-size:15px;

    color:#64748b;

    font-weight:600;

    margin-bottom:9px;

}


.state-select,
.glacier-select{

    width:100%;

    padding:12px 14px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:#ffffff;

    color:#1f2937;

    font-family:'Inter',sans-serif;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    transition:.2s;

}


.state-select:hover,
.glacier-select:hover{

    border-color:#5BBBE8;

}


.state-select:focus,
.glacier-select:focus{

    border-color:#0f4c81;

    box-shadow:0 0 0 3px rgba(15,76,129,0.10);

}


.glacier-select:disabled{

    background:#f1f5f9;

    color:#94a3b8;

    cursor:not-allowed;

}


/* =====================================================
                  INFORMATION TABLE
===================================================== */

.info-table{

    width:100%;

    border-collapse:collapse;

}


.info-table tr{

    border-bottom:1px solid #eceff3;

}


.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}


.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}


/* =====================================================
                    LEGEND
===================================================== */

.legend{

    margin-top:25px;

    padding:15px;

    border:1px solid #e5e7eb;

    border-radius:8px;

    background:#f8fafc;

}


.legend-title{

    font-size:14px;

    font-weight:600;

    color:#16324f;

    margin-bottom:12px;

}


.legend-item{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    font-size:13px;

    color:#475569;

}


.legend-item:last-child{

    margin-bottom:0;

}


.legend-box{

    width:18px;

    height:18px;

    margin-right:10px;

    border-radius:3px;

}


.glacier-legend{

    background:#5BBBE8;

    border:2px solid #00D4FF;

}


/* =====================================================
              DOWNLOAD BUTTON
===================================================== */

.download-btn{

    width:100%;

    margin-top:25px;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:white;

    font-family:'Inter',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;

}


.download-btn:hover{

    background:#1677b7;

    transform:translateY(-1px);

}


.download-btn:disabled{

    background:#cbd5e1;

    cursor:not-allowed;

    transform:none;

}


/* =====================================================
                    MODAL OVERLAY
===================================================== */

.modal-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(6,24,38,0.60);

    backdrop-filter:blur(5px);

    z-index:5000;

    align-items:center;

    justify-content:center;

    padding:20px;

}


/* =====================================================
                    AUTH BOX
===================================================== */

.auth-box{

    width:100%;

    max-width:420px;

    background:#ffffff;

    border-radius:14px;

    padding:32px;

    box-shadow:0 20px 60px rgba(0,0,0,0.25);

    position:relative;

    animation:modalAppear 0.2s ease;

}


@keyframes modalAppear{

    from{

        opacity:0;

        transform:translateY(10px) scale(.98);

    }

    to{

        opacity:1;

        transform:translateY(0) scale(1);

    }

}


.auth-close{

    position:absolute;

    right:18px;

    top:14px;

    border:none;

    background:none;

    font-size:28px;

    color:#64748b;

    cursor:pointer;

}


.auth-close:hover{

    color:#16324f;

}


.auth-logo{

    display:block;

    height:55px;

    width:auto;

    margin:0 auto 15px auto;

}


.auth-title{

    text-align:center;

    font-size:26px;

    font-weight:700;

    color:#16324f;

    margin-bottom:7px;

}


.auth-subtitle{

    text-align:center;

    font-size:13px;

    color:#64748b;

    margin-bottom:25px;

}


/* =====================================================
                    AUTH FORM
===================================================== */

.auth-form{

    display:none;

}


.auth-form.active{

    display:block;

}


.auth-field{

    margin-bottom:16px;

}


.auth-field label{

    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:600;

    color:#475569;

}


.auth-field input{

    width:100%;

    padding:12px 13px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-family:'Inter',sans-serif;

    font-size:14px;

    outline:none;

}


.auth-field input:focus{

    border-color:#1677b7;

    box-shadow:0 0 0 3px rgba(22,119,183,0.10);

}


.auth-submit{

    width:100%;

    padding:13px;

    margin-top:5px;

    border:none;

    border-radius:8px;

    background:#0f4c81;

    color:#ffffff;

    font-family:'Inter',sans-serif;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

}


.auth-submit:hover{

    background:#1677b7;

}


.auth-switch{

    text-align:center;

    margin-top:20px;

    font-size:13px;

    color:#64748b;

}


.auth-switch button{

    border:none;

    background:none;

    color:#0f4c81;

    font-family:'Inter',sans-serif;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

}


.auth-switch button:hover{

    text-decoration:underline;

}


.auth-message{

    display:none;

    padding:10px;

    margin-bottom:15px;

    border-radius:7px;

    font-size:13px;

    text-align:center;

}


.auth-message.error{

    display:block;

    background:#fef2f2;

    color:#b91c1c;

}


.auth-message.success{

    display:block;

    background:#f0fdf4;

    color:#166534;

}


/* =====================================================
                    RESPONSIVE
===================================================== */

@media(max-width:992px){

    #header{

        height:55px;

    }

    .header-logo{

        left:12px;

        height:40px;

    }

    .header-title{

        font-size:22px;

    }

    .container{

        flex-direction:column;

        height:calc(100vh - 55px);

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;

        height:40vh;

    }

    .auth-box{

        padding:25px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
                        HEADER
===================================================== -->

<header id="header">

    <img
        src="Indian_Glaciology_Logo.jpg"
        alt="Indian Glaciology Logo"
        class="header-logo"
    >

    <div class="header-title">

        Indian Glaciology

    </div>

</header>


<!-- =====================================================
                    MAIN CONTAINER
===================================================== -->

<div class="container">


    <!-- MAP -->

    <div id="map"></div>


    <!-- INFORMATION PANEL -->

    <aside id="sidebar">

        <div class="sidebar-content">


            <h2>Feature Information</h2>


            <!-- STATE -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="state-select">

                    Select State/UT

                </label>

                <select
                    id="state-select"
                    class="state-select">

                    <option value="ALL">

                        All States/UTs

                    </option>

                </select>

            </div>


            <!-- GLACIER -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="glacier-select">

                    Select Glacier

                </label>

                <select
                    id="glacier-select"
                    class="glacier-select"
                    disabled>

                    <option value="">

                        Select a State/UT first

                    </option>

                </select>

            </div>


            <!-- INFORMATION TABLE -->

            <table class="info-table">

                <tr>

                    <th>Name</th>

                    <td id="feature-name">-</td>

                </tr>

                <tr>

                    <th>Type</th>

                    <td id="feature-type">-</td>

                </tr>

                <tr>

                    <th>State</th>

                    <td id="feature-state">-</td>

                </tr>

                <tr>

                    <th>Main Basin</th>

                    <td id="main-basin">-</td>

                </tr>

                <tr>

                    <th>Sub Basin</th>

                    <td id="sub-basin">-</td>

                </tr>

                <tr>

                    <th>Area (Sq.km)</th>

                    <td id="feature-area">-</td>

                </tr>

            </table>


            <!-- DOWNLOAD BUTTON -->

            <button
                id="download-btn"
                class="download-btn"
                disabled>

                🔐 Download Selected Glacier

            </button>


            <!-- LEGEND -->

            <div class="legend">

                <div class="legend-title">

                    Map Layers

                </div>

                <div class="legend-item">

                    <div class="legend-box glacier-legend"></div>

                    <span>Glaciers</span>

                </div>

            </div>


        </div>

    </aside>

</div>


<!-- =====================================================
                    AUTH MODAL
===================================================== -->

<div
    id="auth-modal"
    class="modal-overlay">


    <div class="auth-box">


        <button
            id="auth-close"
            class="auth-close">

            ×

        </button>


        <!-- =================================================
                        SIGN UP FORM
        ================================================= -->

        <div
            id="signup-form"
            class="auth-form active">


            <img
                src="Indian_Glaciology_Logo.jpg"
                class="auth-logo"
                alt="Indian Glaciology">


            <div class="auth-title">

                Create Account

            </div>


            <div class="auth-subtitle">

                Create an account to download glacier datasets.

            </div>


            <div
                id="signup-message"
                class="auth-message">

            </div>


            <form id="signup">


                <div class="auth-field">

                    <label for="signup-name">

                        Name

                    </label>

                    <input
                        type="text"
                        id="signup-name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="auth-field">

                    <label for="signup-email">

                        Email

                    </label>

                    <input
                        type="email"
                        id="signup-email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="auth-field">

                    <label for="signup-password">

                        Password

                    </label>

                    <input
                        type="password"
                        id="signup-password"
                        placeholder="Create a password"
                        required>

                </div>


                <div class="auth-field">

                    <label for="signup-confirm">

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="signup-confirm"
                        placeholder="Confirm your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-submit">

                    Sign Up

                </button>


            </form>


            <div class="auth-switch">

                Already have an account?

                <button
                    type="button"
                    id="show-login">

                    Login

                </button>

            </div>


        </div>


        <!-- =================================================
                        LOGIN FORM
        ================================================= -->

        <div
            id="login-form"
            class="auth-form">


            <img
                src="Indian_Glaciology_Logo.jpg"
                class="auth-logo"
                alt="Indian Glaciology">


            <div class="auth-title">

                Welcome Back

            </div>


            <div class="auth-subtitle">

                Login to download glacier datasets.

            </div>


            <div
                id="login-message"
                class="auth-message">

            </div>


            <form id="login">


                <div class="auth-field">

                    <label for="login-email">

                        Email

                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="auth-field">

                    <label for="login-password">

                        Password

                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="auth-submit">

                    Login

                </button>


            </form>


            <div class="auth-switch">

                Don't have an account?

                <button
                    type="button"
                    id="show-signup">

                    Sign Up

                </button>

            </div>


        </div>


    </div>

</div>


<!-- =====================================================
                    LEAFLET JS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl:true,

    minZoom:6,

    maxZoom:18,

    maxBoundsViscosity:1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

const himalayanBounds = L.latLngBounds(

    [27.5,73.5],

    [37.5,97.5]

);


/* =====================================================
                MAP PAN BOUNDARY
===================================================== */

const mapBounds = L.latLngBounds(

    [26.5,72.0],

    [38.5,99.0]

);


map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL VIEW
===================================================== */

map.fitBounds(

    himalayanBounds,

    {

        padding:[20,20]

    }

);


/* =====================================================
                  ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:'Tiles © Esri',

        maxZoom:19

    }

).addTo(map);


/* =====================================================
                    SCALE BAR
===================================================== */

L.control.scale({

    metric:true,

    imperial:false

}).addTo(map);


/* =====================================================
                  GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  GLACIER HIGHLIGHT
===================================================== */

function glacierHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.70

    });

}


/* =====================================================
            RESET GLACIER FEATURE STYLES
===================================================== */

function resetAllLayers(){

    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            glacierLayer.resetStyle(layer);

        });

    }

}


/* =====================================================
              DISPLAY FEATURE INFORMATION
===================================================== */

function displayFeatureInfo(

    name,
    type,
    state,
    mainBasin,
    subBasin,
    area

){

    document.getElementById("feature-name").innerHTML =
        name || "-";

    document.getElementById("feature-type").innerHTML =
        type || "-";

    document.getElementById("feature-state").innerHTML =
        state || "-";

    document.getElementById("main-basin").innerHTML =
        mainBasin || "-";

    document.getElementById("sub-basin").innerHTML =
        subBasin || "-";


    if(

        area !== undefined &&
        area !== null &&
        area !== ""

    ){

        const numericArea = Number(area);


        if(!isNaN(numericArea)){

            document.getElementById("feature-area").innerHTML =
                numericArea.toFixed(3) + " km²";

        }

        else{

            document.getElementById("feature-area").innerHTML =
                area + " km²";

        }

    }

    else{

        document.getElementById("feature-area").innerHTML =
            "-";

    }

}


/* =====================================================
              RESET FEATURE INFORMATION
===================================================== */

function resetFeatureInfo(){

    document.getElementById("feature-name").innerHTML = "-";

    document.getElementById("feature-type").innerHTML = "-";

    document.getElementById("feature-state").innerHTML = "-";

    document.getElementById("main-basin").innerHTML = "-";

    document.getElementById("sub-basin").innerHTML = "-";

    document.getElementById("feature-area").innerHTML = "-";

    document.getElementById("download-btn").disabled = true;

}


/* =====================================================
                  LAYER VARIABLES
===================================================== */

let glacierLayer;


/* =====================================================
              ORIGINAL GLACIER DATA
===================================================== */

let glacierData;


/* =====================================================
            SELECTED GLACIER
===================================================== */

let selectedGlacierFeature = null;


/* =====================================================
            GET STATE FIELD
===================================================== */

function getState(properties){

    if(!properties){

        return "";

    }

    return (

        properties["state"] ??
        properties["State"] ??
        ""

    ).toString().trim();

}


/* =====================================================
            GET GLACIER NAME
===================================================== */

function getGlacierName(properties){

    if(!properties){

        return "";

    }

    return (

        properties["Name"] ??
        properties["name"] ??
        ""

    ).toString().trim();

}


/* =====================================================
              POPULATE STATE DROPDOWN
===================================================== */

function populateStateDropdown(data){

    const stateSelect =
        document.getElementById("state-select");


    const states = new Set();


    data.features.forEach(function(feature){

        const state =
            getState(feature.properties);


        if(state){

            states.add(state);

        }

    });


    const sortedStates =
        Array.from(states).sort(

            function(a,b){

                return a.localeCompare(b);

            }

        );


    sortedStates.forEach(function(state){

        const option =
            document.createElement("option");


        option.value = state;

        option.textContent = state;


        stateSelect.appendChild(option);

    });

}


/* =====================================================
              POPULATE GLACIER DROPDOWN
===================================================== */

function populateGlacierDropdown(selectedState){

    const glacierSelect =
        document.getElementById("glacier-select");


    glacierSelect.innerHTML = "";


    const defaultOption =
        document.createElement("option");


    defaultOption.value = "";

    defaultOption.textContent =
        "Select Glacier";


    glacierSelect.appendChild(defaultOption);


    if(!glacierData){

        glacierSelect.disabled = true;

        return;

    }


    let filteredFeatures;


    if(selectedState === "ALL"){

        filteredFeatures =
            glacierData.features;

    }

    else{

        filteredFeatures =
            glacierData.features.filter(

                function(feature){

                    return (

                        getState(feature.properties)
                        === selectedState

                    );

                }

            );

    }


    filteredFeatures.sort(

        function(a,b){

            return getGlacierName(
                a.properties
            ).localeCompare(
                getGlacierName(b.properties)
            );

        }

    );


    filteredFeatures.forEach(function(feature){

        const name =
            getGlacierName(feature.properties);


        if(name){

            const option =
                document.createElement("option");


            option.value =
                glacierData.features.indexOf(feature);


            option.textContent = name;


            glacierSelect.appendChild(option);

        }

    });


    glacierSelect.disabled = false;

}


/* =====================================================
              FILTER GLACIERS BY STATE
===================================================== */

function filterGlaciersByState(selectedState){

    if(!glacierData){

        return;

    }


    if(glacierLayer){

        map.removeLayer(glacierLayer);

    }


    selectedGlacierFeature = null;


    resetFeatureInfo();


    populateGlacierDropdown(selectedState);


    if(selectedState === "ALL"){

        glacierLayer = L.geoJSON(

            glacierData,

            {

                style:glacierStyle,

                onEachFeature:
                    glacierFeatureEvents

            }

        ).addTo(map);


        map.fitBounds(

            himalayanBounds,

            {

                padding:[20,20]

            }

        );


        return;

    }


    const filteredFeatures =
        glacierData.features.filter(

            function(feature){

                return (

                    getState(feature.properties)
                    === selectedState

                );

            }

        );


    const filteredData = {

        type:"FeatureCollection",

        features:filteredFeatures

    };


    glacierLayer = L.geoJSON(

        filteredData,

        {

            style:glacierStyle,

            onEachFeature:
                glacierFeatureEvents

        }

    ).addTo(map);


    if(

        filteredFeatures.length > 0 &&
        glacierLayer.getBounds().isValid()

    ){

        map.fitBounds(

            glacierLayer.getBounds(),

            {

                padding:[40,40],

                maxZoom:10

            }

        );

    }

}


/* =====================================================
            GLACIER FEATURE EVENTS
===================================================== */

function glacierFeatureEvents(feature, layer){

    layer.on({

        click:function(e){

            resetAllLayers();


            glacierHighlight(e.target);


            selectedGlacierFeature = feature;


            const properties =
                feature.properties;


            displayFeatureInfo(

                getGlacierName(properties),

                properties["Type"],

                getState(properties),

                properties["Main Basin"],

                properties["Sub basin"],

                properties["Area(Sq.km)"]

            );


            document.getElementById(
                "download-btn"
            ).disabled = false;


            const glacierSelect =
                document.getElementById(
                    "glacier-select"
                );


            const index =
                glacierData.features.indexOf(feature);


            if(index !== -1){

                glacierSelect.value = index;

            }

        }

    });

}


/* =====================================================
              SELECT GLACIER FROM DROPDOWN
===================================================== */

function selectGlacierFromDropdown(featureIndex){

    if(

        featureIndex === "" ||
        !glacierData

    ){

        selectedGlacierFeature = null;

        resetFeatureInfo();

        return;

    }


    const feature =
        glacierData.features[
            Number(featureIndex)
        ];


    if(!feature){

        return;

    }


    selectedGlacierFeature = feature;


    let selectedLayer = null;


    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            if(layer.feature === feature){

                selectedLayer = layer;

            }

        });

    }


    resetAllLayers();


    if(selectedLayer){

        glacierHighlight(selectedLayer);

    }


    const properties =
        feature.properties;


    displayFeatureInfo(

        getGlacierName(properties),

        properties["Type"],

        getState(properties),

        properties["Main Basin"],

        properties["Sub basin"],

        properties["Area(Sq.km)"]

    );


    document.getElementById(
        "download-btn"
    ).disabled = false;


    if(

        feature.geometry &&
        selectedLayer

    ){

        const bounds =
            selectedLayer.getBounds();


        if(bounds.isValid()){

            map.fitBounds(

                bounds,

                {

                    padding:[70,70],

                    maxZoom:14

                }

            );

        }

    }

}


/* =====================================================
                    DOWNLOAD GLACIER
===================================================== */

function downloadSelectedGlacier(){

    if(!selectedGlacierFeature){

        alert("Please select a glacier first.");

        return;

    }


    const feature =
        selectedGlacierFeature;


    const name =
        getGlacierName(feature.properties);


    const glacierDataForDownload = {

        type:"FeatureCollection",

        features:[feature]

    };


    const jsonString =
        JSON.stringify(

            glacierDataForDownload,

            null,
            2

        );


    const blob =
        new Blob(

            [jsonString],

            {

                type:"application/geo+json"

            }

        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        name.replace(
            /[^a-z0-9]/gi,
            "_"
        ) + ".geojson";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);

}


/* =====================================================
                  AUTH MODAL
===================================================== */

const authModal =
    document.getElementById("auth-modal");


const signupForm =
    document.getElementById("signup-form");


const loginForm =
    document.getElementById("login-form");


function openAuthModal(){

    authModal.style.display = "flex";

    showSignup();

}


function closeAuthModal(){

    authModal.style.display = "none";

}


function showSignup(){

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    clearAuthMessages();

}


function showLogin(){

    signupForm.classList.remove("active");

    loginForm.classList.add("active");

    clearAuthMessages();

}


function clearAuthMessages(){

    document.getElementById(
        "signup-message"
    ).className = "auth-message";


    document.getElementById(
        "signup-message"
    ).innerHTML = "";


    document.getElementById(
        "login-message"
    ).className = "auth-message";


    document.getElementById(
        "login-message"
    ).innerHTML = "";

}


/* =====================================================
              DOWNLOAD BUTTON EVENT
===================================================== */

document.getElementById(
    "download-btn"
).addEventListener(

    "click",

    function(){

        if(!selectedGlacierFeature){

            alert(
                "Please select a glacier first."
            );

            return;

        }


        openAuthModal();

    }

);


/* =====================================================
                    CLOSE MODAL
===================================================== */

document.getElementById(
    "auth-close"
).addEventListener(

    "click",

    closeAuthModal

);


authModal.addEventListener(

    "click",

    function(e){

        if(e.target === authModal){

            closeAuthModal();

        }

    }

);


/* =====================================================
                SWITCH TO LOGIN
===================================================== */

document.getElementById(
    "show-login"
).addEventListener(

    "click",

    showLogin

);


/* =====================================================
                SWITCH TO SIGNUP
===================================================== */

document.getElementById(
    "show-signup"
).addEventListener(

    "click",

    showSignup

);


/* =====================================================
                    SIGN UP
===================================================== */

document.getElementById(
    "signup"
).addEventListener(

    "submit",

    function(e){

        e.preventDefault();


        const name =
            document.getElementById(
                "signup-name"
            ).value.trim();


        const email =
            document.getElementById(
                "signup-email"
            ).value.trim().toLowerCase();


        const password =
            document.getElementById(
                "signup-password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "signup-confirm"
            ).value;


        const message =
            document.getElementById(
                "signup-message"
            );


        if(password !== confirmPassword){

            message.className =
                "auth-message error";


            message.innerHTML =
                "Passwords do not match.";


            return;

        }


        if(password.length < 6){

            message.className =
                "auth-message error";


            message.innerHTML =
                "Password must contain at least 6 characters.";


            return;

        }


        /*
        ---------------------------------------------------
        PROTOTYPE ONLY

        This stores account information locally
        in the browser.

        DO NOT use this for real production passwords.
        ---------------------------------------------------
        */


        localStorage.setItem(

            "indianGlaciologyUser",

            JSON.stringify({

                name:name,

                email:email,

                password:password

            })

        );


        message.className =
            "auth-message success";


        message.innerHTML =
            "Account created successfully. You can now login.";


        document.getElementById(
            "signup"
        ).reset();


        setTimeout(

            function(){

                showLogin();

                document.getElementById(
                    "login-email"
                ).value = email;

            },

            1200

        );

    }

);


/* =====================================================
                      LOGIN
===================================================== */

document.getElementById(
    "login"
).addEventListener(

    "submit",

    function(e){

        e.preventDefault();


        const email =
            document.getElementById(
                "login-email"
            ).value.trim().toLowerCase();


        const password =
            document.getElementById(
                "login-password"
            ).value;


        const message =
            document.getElementById(
                "login-message"
            );


        const storedUser =
            localStorage.getItem(
                "indianGlaciologyUser"
            );


        if(!storedUser){

            message.className =
                "auth-message error";


            message.innerHTML =
                "No account found. Please sign up first.";


            return;

        }


        const user =
            JSON.parse(storedUser);


        if(

            email !== user.email ||
            password !== user.password

        ){

            message.className =
                "auth-message error";


            message.innerHTML =
                "Incorrect email or password.";


            return;

        }


        message.className =
            "auth-message success";


        message.innerHTML =
            "Login successful. Starting download...";


        localStorage.setItem(
            "indianGlaciologyLoggedIn",
            "true"
        );


        setTimeout(

            function(){

                closeAuthModal();

                downloadSelectedGlacier();

            },

            800

        );

    }

);


/* =====================================================
                    LOAD GLACIERS
===================================================== */

fetch("Indian_Glaciers.geojson")


.then(response => {

    if(!response.ok){

        throw new Error(
            "Indian_Glaciers.geojson could not be loaded."
        );

    }


    return response.json();

})


.then(data => {

    glacierData = data;


    populateStateDropdown(data);


    populateGlacierDropdown("ALL");


    glacierLayer = L.geoJSON(

        data,

        {

            style:glacierStyle,

            onEachFeature:
                glacierFeatureEvents

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(
        "Unable to load Indian_Glaciers.geojson"
    );

});


/* =====================================================
                  STATE DROPDOWN EVENT
===================================================== */

document.getElementById(
    "state-select"
).addEventListener(

    "change",

    function(){

        const selectedState =
            this.value;


        filterGlaciersByState(
            selectedState
        );

    }

);


/* =====================================================
                  GLACIER DROPDOWN EVENT
===================================================== */

document.getElementById(
    "glacier-select"
).addEventListener(

    "change",

    function(){

        selectGlacierFromDropdown(
            this.value
        );

    }

);

</script>
