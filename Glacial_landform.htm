<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glacial Landforms</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>


<style>

/* =====================================================
                    GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    height:100%;

    font-family:'Inter',sans-serif;

    background:#f4f7fa;

}


/* =====================================================
                    CONTAINER
===================================================== */

.container{

    display:flex;

    width:100%;

    height:100vh;

}


/* =====================================================
                      MAP
===================================================== */

#map{

    flex:3.5;

}


/* =====================================================
                  INFORMATION PANEL
===================================================== */

#sidebar{

    width:360px;

    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}

.sidebar-content{

    padding:28px;

}

.sidebar-content h2{

    font-size:28px;

    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}


/* =====================================================
                 STATE SELECTOR
===================================================== */

.state-selector{

    margin-bottom:10px;

    padding-bottom:18px;

    border-bottom:1px solid #eceff3;

}

.state-selector label{

    display:block;

    font-size:15px;

    color:#64748b;

    font-weight:600;

    margin-bottom:9px;

}

.state-select{

    width:100%;

    padding:12px 14px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:#ffffff;

    color:#1f2937;

    font-family:'Inter',sans-serif;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    transition:.2s;

}

.state-select:hover{

    border-color:#5BBBE8;

}

.state-select:focus{

    border-color:#0f4c81;

    box-shadow:0 0 0 3px rgba(15,76,129,0.10);

}


/* =====================================================
                  INFORMATION TABLE
===================================================== */

.info-table{

    width:100%;

    border-collapse:collapse;

}

.info-table tr{

    border-bottom:1px solid #eceff3;

}

.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}

.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}


/* =====================================================
                    LEGEND
===================================================== */

.legend{

    margin-top:25px;

    padding:15px;

    border:1px solid #e5e7eb;

    border-radius:8px;

    background:#f8fafc;

}

.legend-title{

    font-size:14px;

    font-weight:600;

    color:#16324f;

    margin-bottom:12px;

}

.legend-item{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    font-size:13px;

    color:#475569;

}

.legend-item:last-child{

    margin-bottom:0;

}

.legend-box{

    width:18px;

    height:18px;

    margin-right:10px;

    border-radius:3px;

}


/* Glacier legend */

.glacier-legend{

    background:#5BBBE8;

    border:2px solid #00D4FF;

}


/* Lake legend */

.lake-legend{

    background:#0096FF;

    border:2px solid #0066FF;

}


/* =====================================================
                    RESPONSIVE
===================================================== */

@media(max-width:992px){

    .container{

        flex-direction:column;

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;

        height:40vh;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
                         MAP
    ================================================= -->

    <div id="map"></div>


    <!-- =================================================
                    INFORMATION PANEL
    ================================================= -->

    <aside id="sidebar">

        <div class="sidebar-content">


            <h2>Feature Information</h2>


            <!-- =================================================
                        STATE / UT SELECTOR
            ================================================= -->

            <div class="state-selector">

                <label for="state-select">

                    Select State/UT

                </label>

                <select
                    id="state-select"
                    class="state-select">

                    <option value="ALL">

                        All States/UTs

                    </option>

                </select>

            </div>


            <!-- =================================================
                    FEATURE INFORMATION TABLE
            ================================================= -->

            <table class="info-table">


                <!-- NAME -->

                <tr>

                    <th>Name</th>

                    <td id="feature-name">-</td>

                </tr>


                <!-- TYPE -->

                <tr>

                    <th>Type</th>

                    <td id="feature-type">-</td>

                </tr>


                <!-- STATE -->

                <tr>

                    <th>State</th>

                    <td id="feature-state">-</td>

                </tr>


                <!-- MAIN BASIN -->

                <tr>

                    <th>Main Basin</th>

                    <td id="main-basin">-</td>

                </tr>


                <!-- SUB BASIN -->

                <tr>

                    <th>Sub Basin</th>

                    <td id="sub-basin">-</td>

                </tr>


                <!-- AREA -->

                <tr>

                    <th>Area (Sq.km)</th>

                    <td id="feature-area">-</td>

                </tr>


            </table>


            <!-- =================================================
                            LEGEND
            ================================================= -->

            <div class="legend">


                <div class="legend-title">

                    Map Layers

                </div>


                <div class="legend-item">

                    <div class="legend-box glacier-legend"></div>

                    <span>Glaciers</span>

                </div>


                <div class="legend-item">

                    <div class="legend-box lake-legend"></div>

                    <span>Glacial Lakes</span>

                </div>


            </div>


        </div>

    </aside>


</div>


<!-- =====================================================
                    LEAFLET JS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl:true,

    minZoom:6,

    maxZoom:18,

    maxBoundsViscosity:1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

const himalayanBounds = L.latLngBounds(

    [27.5,73.5],

    [37.5,97.5]

);


/* =====================================================
                MAP PAN BOUNDARY
===================================================== */

const mapBounds = L.latLngBounds(

    [26.5,72.0],

    [38.5,99.0]

);


/* Apply map movement restriction */

map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL VIEW
===================================================== */

map.fitBounds(

    himalayanBounds,

    {

        padding:[20,20]

    }

);


/* =====================================================
                  ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:'Tiles © Esri',

        maxZoom:19

    }

).addTo(map);


/* =====================================================
                    SCALE BAR
===================================================== */

L.control.scale({

    metric:true,

    imperial:false

}).addTo(map);


/* =====================================================
                  GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  GLACIER HIGHLIGHT
===================================================== */

function glacierHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.70

    });

}


/* =====================================================
                    LAKE STYLE
===================================================== */

function lakeStyle(feature){

    return{

        color:"#0096FF",

        weight:1.8,

        fillColor:"#0096FF",

        fillOpacity:0.55

    };

}


/* =====================================================
                  LAKE HIGHLIGHT
===================================================== */

function lakeHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.80

    });

}


/* =====================================================
            RESET ALL FEATURE STYLES
===================================================== */

function resetAllLayers(){

    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            glacierLayer.resetStyle(layer);

        });

    }


    if(lakeLayer){

        lakeLayer.eachLayer(function(layer){

            lakeLayer.resetStyle(layer);

        });

    }

}


/* =====================================================
              DISPLAY FEATURE INFORMATION
===================================================== */

function displayFeatureInfo(

    name,

    type,

    state,

    mainBasin,

    subBasin,

    area

){

    document.getElementById(

        "feature-name"

    ).innerHTML = name || "-";


    document.getElementById(

        "feature-type"

    ).innerHTML = type || "-";


    document.getElementById(

        "feature-state"

    ).innerHTML = state || "-";


    document.getElementById(

        "main-basin"

    ).innerHTML = mainBasin || "-";


    document.getElementById(

        "sub-basin"

    ).innerHTML = subBasin || "-";


    if(

        area !== undefined &&

        area !== null &&

        area !== ""

    ){

        const numericArea = Number(area);


        if(!isNaN(numericArea)){

            document.getElementById(

                "feature-area"

            ).innerHTML =

                numericArea.toFixed(3)

                + " km²";

        }

        else{

            document.getElementById(

                "feature-area"

            ).innerHTML =

                area + " km²";

        }

    }

    else{

        document.getElementById(

            "feature-area"

        ).innerHTML = "-";

    }

}


/* =====================================================
                  RESET FEATURE INFORMATION
===================================================== */

function resetFeatureInfo(){

    document.getElementById(

        "feature-name"

    ).innerHTML = "-";


    document.getElementById(

        "feature-type"

    ).innerHTML = "-";


    document.getElementById(

        "feature-state"

    ).innerHTML = "-";


    document.getElementById(

        "main-basin"

    ).innerHTML = "-";


    document.getElementById(

        "sub-basin"

    ).innerHTML = "-";


    document.getElementById(

        "feature-area"

    ).innerHTML = "-";

}


/* =====================================================
                  LAYER VARIABLES
===================================================== */

let glacierLayer;

let lakeLayer;


/* =====================================================
              ORIGINAL GLACIER DATA
===================================================== */

let glacierData;


/* =====================================================
            GET STATE FIELD FROM GEOJSON
===================================================== */

/*
   This function supports both:

   state

   and

   State

   so the dropdown will work even if
   the field capitalization differs.
*/

function getState(properties){

    if(!properties){

        return "";

    }


    return (

        properties["state"] ??

        properties["State"] ??

        ""

    ).toString().trim();

}


/* =====================================================
              POPULATE STATE DROPDOWN
===================================================== */

function populateStateDropdown(data){

    const stateSelect =

        document.getElementById(

            "state-select"

        );


    const states = new Set();


    /* Read state from every glacier */

    data.features.forEach(function(feature){

        const state = getState(

            feature.properties

        );


        if(state){

            states.add(state);

        }

    });


    /* Sort states alphabetically */

    const sortedStates =

        Array.from(states).sort(

            function(a,b){

                return a.localeCompare(b);

            }

        );


    /* Add states to dropdown */

    sortedStates.forEach(function(state){

        const option =

            document.createElement("option");


        option.value = state;

        option.textContent = state;


        stateSelect.appendChild(option);

    });

}


/* =====================================================
              FILTER GLACIERS BY STATE
===================================================== */

function filterGlaciersByState(selectedState){

    if(!glacierData){

        return;

    }


    /* Remove existing glacier layer */

    if(glacierLayer){

        map.removeLayer(glacierLayer);

    }


    resetFeatureInfo();


    /*
       ALL STATES
    */

    if(selectedState === "ALL"){

        glacierLayer = L.geoJSON(

            glacierData,

            {

                style:glacierStyle,

                onEachFeature:

                    glacierFeatureEvents

            }

        ).addTo(map);


        return;

    }


    /*
       FILTER SELECTED STATE
    */

    const filteredFeatures =

        glacierData.features.filter(

            function(feature){

                return (

                    getState(

                        feature.properties

                    ) === selectedState

                );

            }

        );


    const filteredData = {

        type:"FeatureCollection",

        features:filteredFeatures

    };


    glacierLayer = L.geoJSON(

        filteredData,

        {

            style:glacierStyle,

            onEachFeature:

                glacierFeatureEvents

        }

    ).addTo(map);


    /*
       Zoom to selected state glaciers
    */

    if(

        filteredFeatures.length > 0 &&

        glacierLayer.getBounds().isValid()

    ){

        map.fitBounds(

            glacierLayer.getBounds(),

            {

                padding:[40,40],

                maxZoom:10

            }

        );

    }

}


/* =====================================================
            GLACIER FEATURE EVENTS
===================================================== */

function glacierFeatureEvents(

    feature,

    layer

){

    layer.on({

        click:function(e){

            /* Reset all layers */

            resetAllLayers();


            /* Highlight selected glacier */

            glacierHighlight(

                e.target

            );


            /* Read glacier attributes */

            const properties =

                feature.properties;


            displayFeatureInfo(

                properties["Name"],

                properties["Type"],

                getState(properties),

                properties["Main Basin"],

                properties["Sub basin"],

                properties["Area(Sq.km)"]

            );

        }

    });

}


/* =====================================================
                    LOAD GLACIERS
===================================================== */

fetch("Indian_Glaciers.geojson")


.then(response => {

    if(!response.ok){

        throw new Error(

            "Indian_Glaciers.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data => {

    /*
       Save original GeoJSON
       so it can be filtered later.
    */

    glacierData = data;


    /*
       Automatically read all unique
       states from the 'state' field.
    */

    populateStateDropdown(data);


    /*
       Load all glaciers initially.
    */

    glacierLayer = L.geoJSON(

        data,

        {

            style:glacierStyle,

            onEachFeature:

                glacierFeatureEvents

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glaciers.geojson"

    );

});


/* =====================================================
                  STATE DROPDOWN EVENT
===================================================== */

document.getElementById(

    "state-select"

).addEventListener(

    "change",

    function(){

        const selectedState =

            this.value;


        /*
           Reset selected feature
        */

        resetFeatureInfo();


        /*
           Reset layer styles
        */

        resetAllLayers();


        /*
           Filter glacier layer
        */

        filterGlaciersByState(

            selectedState

        );

    }

);


/* =====================================================
                  LOAD GLACIAL LAKES
===================================================== */

fetch("Indian_Glacial_Lakes.geojson")


.then(response =>{

    if(!response.ok){

        throw new Error(

            "Indian_Glacial_Lakes.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data =>{

    lakeLayer = L.geoJSON(

        data,

        {

            style:lakeStyle,


            onEachFeature:function(

                feature,

                layer

            ){

                layer.on({

                    click:function(e){

                        /*
                           Reset both layers
                        */

                        resetAllLayers();


                        /*
                           Highlight lake
                        */

                        lakeHighlight(

                            e.target

                        );


                        /*
                           Read lake attributes
                        */

                        const properties =

                            feature.properties;


                        displayFeatureInfo(

                            properties["Name"],

                            properties["Type"],

                            properties["State"] ??

                            properties["state"],

                            "-",

                            "-",

                            properties["Area(km2)"]

                        );

                    }

                });

            }

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glacial_Lakes.geojson"

    );

});


</script>


</body>

</html>
