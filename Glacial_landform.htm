<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Indian Glaciology</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>

/* =====================================================
                    GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    height:100%;

    font-family:'Inter',sans-serif;

    background:#f4f7fa;

}


/* =====================================================
                    HEADER
===================================================== */

#header{

    height:60px;

    width:100%;

    background:#ffffff;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    border-bottom:1px solid #e5e7eb;

    z-index:1000;

}


/* =====================================================
                    HEADER LOGO
===================================================== */

.header-logo{

    position:absolute;

    left:20px;

    height:44px;

    width:auto;

    object-fit:contain;

}


/* =====================================================
                    HEADER TITLE
===================================================== */

.header-title{

    font-size:34px;

    font-weight:700;

    letter-spacing:0.5px;

    background:linear-gradient(

        90deg,

        #0f4c81,

        #1677b7,

        #5BBBE8

    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    background-clip:text;

}


/* =====================================================
                    MAIN CONTAINER
===================================================== */

.container{

    display:flex;

    width:100%;

    height:calc(100vh - 60px);

}


/* =====================================================
                      MAP
===================================================== */

#map{

    flex:3.5;

}


/* =====================================================
                  INFORMATION PANEL
===================================================== */

#sidebar{

    width:360px;

    background:#ffffff;

    border-left:1px solid #e5e7eb;

    overflow-y:auto;

}

.sidebar-content{

    padding:28px;

}

.sidebar-content h2{

    font-size:28px;

    color:#16324f;

    margin-bottom:25px;

    font-weight:600;

}


/* =====================================================
                 DROPDOWN SECTION
===================================================== */

.selector-section{

    margin-bottom:10px;

    padding-bottom:18px;

    border-bottom:1px solid #eceff3;

}


/* =====================================================
                 DROPDOWN LABEL
===================================================== */

.selector-label{

    display:block;

    font-size:15px;

    color:#64748b;

    font-weight:600;

    margin-bottom:9px;

}


/* =====================================================
                  DROPDOWN
===================================================== */

.state-select,
.glacier-select{

    width:100%;

    padding:12px 14px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    background:#ffffff;

    color:#1f2937;

    font-family:'Inter',sans-serif;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

    outline:none;

    transition:.2s;

}


/* Hover */

.state-select:hover,
.glacier-select:hover{

    border-color:#5BBBE8;

}


/* Focus */

.state-select:focus,
.glacier-select:focus{

    border-color:#0f4c81;

    box-shadow:0 0 0 3px rgba(15,76,129,0.10);

}


/* Disabled Glacier Dropdown */

.glacier-select:disabled{

    background:#f1f5f9;

    color:#94a3b8;

    cursor:not-allowed;

}


/* =====================================================
                  INFORMATION TABLE
===================================================== */

.info-table{

    width:100%;

    border-collapse:collapse;

}

.info-table tr{

    border-bottom:1px solid #eceff3;

}

.info-table th{

    width:45%;

    text-align:left;

    padding:18px 0;

    font-size:15px;

    color:#64748b;

    font-weight:600;

}

.info-table td{

    font-size:15px;

    color:#1f2937;

    font-weight:600;

}


/* =====================================================
                    LEGEND
===================================================== */

.legend{

    margin-top:25px;

    padding:15px;

    border:1px solid #e5e7eb;

    border-radius:8px;

    background:#f8fafc;

}

.legend-title{

    font-size:14px;

    font-weight:600;

    color:#16324f;

    margin-bottom:12px;

}

.legend-item{

    display:flex;

    align-items:center;

    margin-bottom:10px;

    font-size:13px;

    color:#475569;

}

.legend-item:last-child{

    margin-bottom:0;

}

.legend-box{

    width:18px;

    height:18px;

    margin-right:10px;

    border-radius:3px;

}


/* Glacier legend */

.glacier-legend{

    background:#5BBBE8;

    border:2px solid #00D4FF;

}


/* =====================================================
                    RESPONSIVE
===================================================== */

@media(max-width:992px){

    #header{

        height:55px;

    }

    .header-logo{

        left:12px;

        height:40px;

    }

    .header-title{

        font-size:22px;

    }

    .container{

        flex-direction:column;

        height:calc(100vh - 55px);

    }

    #map{

        height:60vh;

    }

    #sidebar{

        width:100%;

        height:40vh;

    }

}

</style>

</head>


<body>


<!-- =====================================================
                        HEADER
===================================================== -->

<header id="header">

    <img
        src="Indian_Glaciology_Logo.jpg"
        alt="Indian Glaciology Logo"
        class="header-logo"
    >

    <div class="header-title">

        Indian Glaciology

    </div>

</header>


<!-- =====================================================
                    MAIN CONTAINER
===================================================== -->

<div class="container">


    <!-- =================================================
                         MAP
    ================================================= -->

    <div id="map"></div>


    <!-- =================================================
                    INFORMATION PANEL
    ================================================= -->

    <aside id="sidebar">

        <div class="sidebar-content">


            <h2>Feature Information</h2>


            <!-- =================================================
                        SELECT STATE / UT
            ================================================= -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="state-select">

                    Select State/UT

                </label>


                <select
                    id="state-select"
                    class="state-select">

                    <option value="ALL">

                        All States/UTs

                    </option>

                </select>

            </div>


            <!-- =================================================
                        SELECT GLACIER
            ================================================= -->

            <div class="selector-section">

                <label
                    class="selector-label"
                    for="glacier-select">

                    Select Glacier

                </label>


                <select
                    id="glacier-select"
                    class="glacier-select"
                    disabled>

                    <option value="">

                        Select a State/UT first

                    </option>

                </select>

            </div>


            <!-- =================================================
                    FEATURE INFORMATION TABLE
            ================================================= -->

            <table class="info-table">


                <!-- NAME -->

                <tr>

                    <th>Name</th>

                    <td id="feature-name">-</td>

                </tr>


                <!-- TYPE -->

                <tr>

                    <th>Type</th>

                    <td id="feature-type">-</td>

                </tr>


                <!-- STATE -->

                <tr>

                    <th>State</th>

                    <td id="feature-state">-</td>

                </tr>


                <!-- MAIN BASIN -->

                <tr>

                    <th>Main Basin</th>

                    <td id="main-basin">-</td>

                </tr>


                <!-- SUB BASIN -->

                <tr>

                    <th>Sub Basin</th>

                    <td id="sub-basin">-</td>

                </tr>


                <!-- AREA -->

                <tr>

                    <th>Area (Sq.km)</th>

                    <td id="feature-area">-</td>

                </tr>


            </table>


            <!-- =================================================
                            LEGEND
            ================================================= -->

            <div class="legend">


                <div class="legend-title">

                    Map Layers

                </div>


                <div class="legend-item">

                    <div class="legend-box glacier-legend"></div>

                    <span>Glaciers</span>

                </div>


            </div>


        </div>

    </aside>


</div>


<!-- =====================================================
                    LEAFLET JS
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =====================================================
                    CREATE MAP
===================================================== */

const map = L.map('map', {

    zoomControl:true,

    minZoom:6,

    maxZoom:18,

    maxBoundsViscosity:1.0

});


/* =====================================================
              INDIAN HIMALAYAN EXTENT
===================================================== */

const himalayanBounds = L.latLngBounds(

    [27.5,73.5],

    [37.5,97.5]

);


/* =====================================================
                MAP PAN BOUNDARY
===================================================== */

const mapBounds = L.latLngBounds(

    [26.5,72.0],

    [38.5,99.0]

);


map.setMaxBounds(mapBounds);


/* =====================================================
                  INITIAL VIEW
===================================================== */

map.fitBounds(

    himalayanBounds,

    {

        padding:[20,20]

    }

);


/* =====================================================
                  ESRI SATELLITE
===================================================== */

L.tileLayer(

    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:'Tiles © Esri',

        maxZoom:19

    }

).addTo(map);


/* =====================================================
                    SCALE BAR
===================================================== */

L.control.scale({

    metric:true,

    imperial:false

}).addTo(map);


/* =====================================================
                  GLACIER STYLE
===================================================== */

function glacierStyle(feature){

    return{

        color:"#00D4FF",

        weight:1.5,

        fillColor:"#5BBBE8",

        fillOpacity:0.35

    };

}


/* =====================================================
                  GLACIER HIGHLIGHT
===================================================== */

function glacierHighlight(layer){

    layer.setStyle({

        color:"#FFD700",

        weight:3,

        fillOpacity:0.70

    });

}


/* =====================================================
            RESET GLACIER FEATURE STYLES
===================================================== */

function resetAllLayers(){

    if(glacierLayer){

        glacierLayer.eachLayer(function(layer){

            glacierLayer.resetStyle(layer);

        });

    }

}


/* =====================================================
              DISPLAY FEATURE INFORMATION
===================================================== */

function displayFeatureInfo(

    name,

    type,

    state,

    mainBasin,

    subBasin,

    area

){

    document.getElementById(

        "feature-name"

    ).innerHTML = name || "-";


    document.getElementById(

        "feature-type"

    ).innerHTML = type || "-";


    document.getElementById(

        "feature-state"

    ).innerHTML = state || "-";


    document.getElementById(

        "main-basin"

    ).innerHTML = mainBasin || "-";


    document.getElementById(

        "sub-basin"

    ).innerHTML = subBasin || "-";


    if(

        area !== undefined &&

        area !== null &&

        area !== ""

    ){

        const numericArea = Number(area);


        if(!isNaN(numericArea)){

            document.getElementById(

                "feature-area"

            ).innerHTML =

                numericArea.toFixed(3)

                + " km²";

        }

        else{

            document.getElementById(

                "feature-area"

            ).innerHTML =

                area + " km²";

        }

    }

    else{

        document.getElementById(

            "feature-area"

        ).innerHTML = "-";

    }

}


/* =====================================================
              RESET FEATURE INFORMATION
===================================================== */

function resetFeatureInfo(){

    document.getElementById(

        "feature-name"

    ).innerHTML = "-";


    document.getElementById(

        "feature-type"

    ).innerHTML = "-";


    document.getElementById(

        "feature-state"

    ).innerHTML = "-";


    document.getElementById(

        "main-basin"

    ).innerHTML = "-";


    document.getElementById(

        "sub-basin"

    ).innerHTML = "-";


    document.getElementById(

        "feature-area"

    ).innerHTML = "-";

}


/* =====================================================
                  LAYER VARIABLES
===================================================== */

let glacierLayer;


/* =====================================================
              ORIGINAL GLACIER DATA
===================================================== */

let glacierData;


/* =====================================================
            GET STATE FIELD FROM GEOJSON
===================================================== */

function getState(properties){

    if(!properties){

        return "";

    }


    return (

        properties["state"] ??

        properties["State"] ??

        ""

    ).toString().trim();

}


/* =====================================================
            GET GLACIER NAME FROM GEOJSON
===================================================== */

function getGlacierName(properties){

    if(!properties){

        return "";

    }


    return (

        properties["Name"] ??

        properties["name"] ??

        ""

    ).toString().trim();

}


/* =====================================================
              POPULATE STATE DROPDOWN
===================================================== */

function populateStateDropdown(data){

    const stateSelect =

        document.getElementById(

            "state-select"

        );


    const states = new Set();


    data.features.forEach(function(feature){

        const state = getState(

            feature.properties

        );


        if(state){

            states.add(state);

        }

    });


    const sortedStates =

        Array.from(states).sort(

            function(a,b){

                return a.localeCompare(b);

            }

        );


    sortedStates.forEach(function(state){

        const option =

            document.createElement("option");


        option.value = state;

        option.textContent = state;


        stateSelect.appendChild(option);

    });

}


/* =====================================================
              POPULATE GLACIER DROPDOWN
===================================================== */

function populateGlacierDropdown(selectedState){

    const glacierSelect =

        document.getElementById(

            "glacier-select"

        );


    glacierSelect.innerHTML = "";


    const defaultOption =

        document.createElement("option");


    defaultOption.value = "";

    defaultOption.textContent =

        "Select Glacier";


    glacierSelect.appendChild(

        defaultOption

    );


    if(!glacierData){

        glacierSelect.disabled = true;

        return;

    }


    let filteredFeatures;


    if(selectedState === "ALL"){

        filteredFeatures =

            glacierData.features;

    }

    else{

        filteredFeatures =

            glacierData.features.filter(

                function(feature){

                    return (

                        getState(

                            feature.properties

                        ) === selectedState

                    );

                }

            );

    }


    filteredFeatures.sort(

        function(a,b){

            return getGlacierName(

                a.properties

            ).localeCompare(

                getGlacierName(

                    b.properties

                )

            );

        }

    );


    filteredFeatures.forEach(

        function(feature){

            const name =

                getGlacierName(

                    feature.properties

                );


            if(name){

                const option =

                    document.createElement(

                        "option"

                    );


                option.value =

                    glacierData.features.indexOf(

                        feature

                    );


                option.textContent = name;


                glacierSelect.appendChild(

                    option

                );

            }

        }

    );


    glacierSelect.disabled = false;

}


/* =====================================================
              FILTER GLACIERS BY STATE
===================================================== */

function filterGlaciersByState(selectedState){

    if(!glacierData){

        return;

    }


    if(glacierLayer){

        map.removeLayer(glacierLayer);

    }


    resetFeatureInfo();


    populateGlacierDropdown(

        selectedState

    );


    /* =================================================
                    ALL STATES
    ================================================= */

    if(selectedState === "ALL"){

        glacierLayer = L.geoJSON(

            glacierData,

            {

                style:glacierStyle,

                onEachFeature:

                    glacierFeatureEvents

            }

        ).addTo(map);


        map.fitBounds(

            himalayanBounds,

            {

                padding:[20,20]

            }

        );


        return;

    }


    /* =================================================
                  FILTER SELECTED STATE
    ================================================= */

    const filteredFeatures =

        glacierData.features.filter(

            function(feature){

                return (

                    getState(

                        feature.properties

                    ) === selectedState

                );

            }

        );


    const filteredData = {

        type:"FeatureCollection",

        features:filteredFeatures

    };


    glacierLayer = L.geoJSON(

        filteredData,

        {

            style:glacierStyle,

            onEachFeature:

                glacierFeatureEvents

        }

    ).addTo(map);


    /* =================================================
                  ZOOM TO STATE GLACIERS
    ================================================= */

    if(

        filteredFeatures.length > 0 &&

        glacierLayer.getBounds().isValid()

    ){

        map.fitBounds(

            glacierLayer.getBounds(),

            {

                padding:[40,40],

                maxZoom:10

            }

        );

    }

}


/* =====================================================
            GLACIER FEATURE EVENTS
===================================================== */

function glacierFeatureEvents(

    feature,

    layer

){

    layer.on({

        click:function(e){

            /* Reset glacier styles */

            resetAllLayers();


            /* Highlight selected glacier */

            glacierHighlight(

                e.target

            );


            /* Read glacier attributes */

            const properties =

                feature.properties;


            displayFeatureInfo(

                getGlacierName(properties),

                properties["Type"],

                getState(properties),

                properties["Main Basin"],

                properties["Sub basin"],

                properties["Area(Sq.km)"]

            );


            /* Automatically select glacier */

            const glacierSelect =

                document.getElementById(

                    "glacier-select"

                );


            const index =

                glacierData.features.indexOf(

                    feature

                );


            if(index !== -1){

                glacierSelect.value = index;

            }

        }

    });

}


/* =====================================================
              SELECT GLACIER FROM DROPDOWN
===================================================== */

function selectGlacierFromDropdown(

    featureIndex

){

    if(

        featureIndex === "" ||

        !glacierData

    ){

        resetFeatureInfo();

        return;

    }


    const feature =

        glacierData.features[

            Number(featureIndex)

        ];


    if(!feature){

        return;

    }


    /* =================================================
              FIND CORRESPONDING LEAFLET LAYER
    ================================================= */

    let selectedLayer = null;


    if(glacierLayer){

        glacierLayer.eachLayer(

            function(layer){

                if(

                    layer.feature === feature

                ){

                    selectedLayer = layer;

                }

            }

        );

    }


    /* Reset all glacier styles */

    resetAllLayers();


    /* Highlight selected glacier */

    if(selectedLayer){

        glacierHighlight(

            selectedLayer

        );

    }


    /* Read glacier attributes */

    const properties =

        feature.properties;


    displayFeatureInfo(

        getGlacierName(properties),

        properties["Type"],

        getState(properties),

        properties["Main Basin"],

        properties["Sub basin"],

        properties["Area(Sq.km)"]

    );


    /* =================================================
                    ZOOM TO GLACIER
    ================================================= */

    if(

        feature.geometry &&

        selectedLayer

    ){

        const bounds =

            selectedLayer.getBounds();


        if(bounds.isValid()){

            map.fitBounds(

                bounds,

                {

                    padding:[70,70],

                    maxZoom:14

                }

            );

        }

    }

}


/* =====================================================
                    LOAD GLACIERS
===================================================== */

fetch("Indian_Glaciers.geojson")


.then(response => {

    if(!response.ok){

        throw new Error(

            "Indian_Glaciers.geojson could not be loaded."

        );

    }


    return response.json();

})


.then(data => {

    /* Store original GeoJSON */

    glacierData = data;


    /* Populate State/UT dropdown */

    populateStateDropdown(data);


    /* Populate Glacier dropdown */

    populateGlacierDropdown("ALL");


    /* Load all glaciers initially */

    glacierLayer = L.geoJSON(

        data,

        {

            style:glacierStyle,

            onEachFeature:

                glacierFeatureEvents

        }

    ).addTo(map);

})


.catch(error =>{

    console.error(error);

    alert(

        "Unable to load Indian_Glaciers.geojson"

    );

});


/* =====================================================
                  STATE DROPDOWN EVENT
===================================================== */

document.getElementById(

    "state-select"

).addEventListener(

    "change",

    function(){

        const selectedState =

            this.value;


        resetFeatureInfo();


        filterGlaciersByState(

            selectedState

        );

    }

);


/* =====================================================
                  GLACIER DROPDOWN EVENT
===================================================== */

document.getElementById(

    "glacier-select"

).addEventListener(

    "change",

    function(){

        const selectedGlacier =

            this.value;


        selectGlacierFromDropdown(

            selectedGlacier

        );

    }

);


</script>


</body>

</html>
